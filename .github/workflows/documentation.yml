name: Documentation

on:
  pull_request:
  push:
  workflow_dispatch:
    inputs:
      release_ready:
        description: Fail if publication placeholders remain
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docs-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install framework dependencies for the offline tests
        run: python -m pip install -e ".[langgraph]"
      - name: Run the runtime and documentation tests
        run: python -m unittest discover -v

  docs:
    name: Build and check docs
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Install example dependencies and the tested Mintlify CLI
        run: |
          python -m pip install -e ".[langgraph]"
          npm install --global mint@4.2.1178
      - name: Check navigation, Markdown, Python syntax, links, and images
        run: python scripts/check_docs.py
      - name: Execute README and getting-started examples without model calls
        run: python scripts/verify_doc_examples.py
      - name: Check publication readiness
        if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.release_ready)
        run: python scripts/check_docs.py --release
      - name: Build and validate Mintlify
        working-directory: docs
        run: mint validate
      - name: Check Mintlify internal links and anchors
        working-directory: docs
        run: mint broken-links --check-anchors
